name: LGChannelSearch
options:
  bundleIdPrefix: com.ahmedfitoh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: NO
targets:
  LGChannelSearch:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Core
      - path: Data
      - path: Search
      - path: Features
      - path: Tests/Mocks
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedfitoh.LGChannelSearch
        PRODUCT_NAME: LGChannelSearch
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      testTargets:
        - LGChannelSearchTests
      commandLineArguments:
        "--mock-tv": false
  LGChannelSearchTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - Mocks
          - Fixtures
    resources:
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: LGChannelSearch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmedfitoh.LGChannelSearchTests
